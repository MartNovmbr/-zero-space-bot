<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pearly</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script></head><body><div id="poryadok-prototype" class="viz-dotted-background">
  <style>
    html,body {margin:0;background:#20201e;color:#f4f1e9;min-height:100%;}
    [hidden] {display:none!important;}
    button {cursor:pointer;}
    button:disabled {opacity:.55;}
    #poryadok-prototype {padding:0!important;}
    #poryadok-prototype .phone {width:100%!important;max-width:520px;min-height:100dvh;border:0!important;border-radius:0!important;box-shadow:none!important;}
    #poryadok-prototype .status {display:none!important;}
    #poryadok-prototype .modal {position:fixed!important;inset:0;overflow-y:auto;z-index:20!important;}
    #poryadok-prototype .sheet {max-height:90dvh;overflow-y:auto;}
    #poryadok-prototype textarea {font:inherit;font-size:16px;}
    #title-counter {text-align:right;color:var(--p-muted);}

    #poryadok-prototype {
      --p-paper: light-dark(#f7f5ef, #20201e);
      --p-paper-2: light-dark(#efede6, #292926);
      --p-ink: light-dark(#22211f, #f4f1e9);
      --p-muted: light-dark(#706d66, #aaa69e);
      --p-line: light-dark(#cbc7bd, #504e49);
      --p-fill: light-dark(#242321, #efede7);
      --p-on-fill: light-dark(#faf8f2, #252421);
      --p-soft: light-dark(#e7e3d9, #363531);
      --p-pearl-hi: light-dark(#fffdf7, #fffdf7);
      --p-pearl-mid: light-dark(#eee9dd, #e9e5dc);
      --p-pearl-shade: light-dark(#c8c1b4, #c5bfb4);
      color-scheme: dark;
      display: grid;
      place-items: start center;
      padding: 18px 8px;
      color: var(--p-ink);
    }
    #poryadok-prototype * { box-sizing: border-box; }
    #poryadok-prototype button,
    #poryadok-prototype input,
    #poryadok-prototype select { font: inherit; color: inherit; }
    #poryadok-prototype .phone {
      width: min(390px, 100%);
      min-height: 660px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--p-paper);
      border: 1px solid var(--p-line);
      border-radius: 34px;
      box-shadow: 0 18px 50px light-dark(rgb(40 35 25 / .16), rgb(0 0 0 / .35));
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    #poryadok-prototype .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 22px 5px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 12px;
      font-weight: 500;
    }
    #poryadok-prototype .status-icons { display: flex; align-items: center; gap: 5px; }
    #poryadok-prototype .status-icons i { width: 14px; height: 14px; }
    #poryadok-prototype .screen { flex: 1; padding: 18px 22px 16px; }
    #poryadok-prototype #screen-today {
      display: flex;
      flex-direction: column;
      padding-bottom: 16px;
    }
    #poryadok-prototype #screen-today[hidden] { display: none; }
    #poryadok-prototype #screen-today #today-action { margin-top: 0; flex-shrink: 0; }
    #poryadok-prototype #screen-today .tangle-wrap { flex: 1; }
    #poryadok-prototype .screen[hidden] { display: none; }
    #poryadok-prototype h1,
    #poryadok-prototype h2,
    #poryadok-prototype h3,
    #poryadok-prototype p { margin-top: 0; }
    #poryadok-prototype h1 { margin-bottom: 8px; font-size: 30px; font-weight: 400; line-height: 1.15; }
    #poryadok-prototype .today-separator,
    #poryadok-prototype .today-task-count { color: var(--p-muted); font-size: 16px; font-weight: 400; opacity: .62; }
    #poryadok-prototype h2 { margin-bottom: 12px; font-size: 24px; font-weight: 400; }
    #poryadok-prototype h3 { margin: 0; font-size: 17px; font-weight: 500; }
    #poryadok-prototype .lead { color: var(--p-muted); line-height: 1.45; margin-bottom: 12px; }
    #poryadok-prototype .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #poryadok-prototype .round-action,
    #poryadok-prototype .icon-action {
      border: 1px solid var(--p-line);
      background: transparent;
      display: inline-grid;
      place-items: center;
      min-width: 44px;
      min-height: 44px;
      border-radius: 999px;
    }
    #poryadok-prototype .primary,
    #poryadok-prototype .secondary,
    #poryadok-prototype .category,
    #poryadok-prototype .filter,
    #poryadok-prototype .nav-button,
    #poryadok-prototype .link-button {
      border: 0;
      background: transparent;
    }
    #poryadok-prototype .primary {
      width: 100%;
      min-height: 48px;
      border-radius: 999px;
      background: var(--p-fill);
      color: var(--p-on-fill);
      padding: 10px 18px;
    }
    #poryadok-prototype .secondary {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--p-line);
      border-radius: 14px;
      padding: 10px 14px;
    }
    #poryadok-prototype .tangle-wrap { display: grid; place-items: center; min-height: 310px; }
    #poryadok-prototype #tangle { width: min(300px, 82vw); height: 310px; display: block; }
    #poryadok-prototype #tangle[hidden] { display: none; }
    #poryadok-prototype #tangle {
      mix-blend-mode: lighten;
      filter: grayscale(1) contrast(1.3);
      mask-image: radial-gradient(ellipse at center, black 48%, transparent 76%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 48%, transparent 76%);
    }
    #poryadok-prototype .tangle-wrap > * { grid-area: 1 / 1; }
    #poryadok-prototype .calm-visual {
      position: relative;
      width: min(300px, 82vw);
      height: 310px;
      display: block;
      isolation: isolate;
    }
    #poryadok-prototype .calm-visual[hidden] { display: none; }
    #poryadok-prototype .pearl-shell {
      position: absolute;
      top: 43%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      width: 202px;
      height: 202px;
      object-fit: contain;
      filter: drop-shadow(0 8px 10px color-mix(in srgb, var(--p-ink) 9%, transparent));
    }
    #poryadok-prototype .category-list { display: grid; gap: 10px; }
    #poryadok-prototype .category {
      width: 100%;
      min-height: 68px;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 10px;
      text-align: left;
      padding: 10px 12px;
      border: 1px solid var(--p-line);
      border-radius: 13px;
    }
    #poryadok-prototype .category i { width: 25px; height: 25px; }
    #poryadok-prototype .category small { display: block; color: var(--p-muted); margin-top: 2px; }
    #poryadok-prototype .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 7px; margin-top: 21px; scrollbar-width: none; }
    #poryadok-prototype .coat-icon { filter: grayscale(1); font-size: 20px; }
    #poryadok-prototype .filter {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--p-soft);
      font-size: 13px;
    }
    #poryadok-prototype .filter[aria-pressed="true"] { background: var(--p-fill); color: var(--p-on-fill); }
    #poryadok-prototype .task-group { margin-top: 14px; }
    #poryadok-prototype .group-title { display: flex; align-items: center; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--p-line); }
    #poryadok-prototype .group-title i { width: 19px; height: 19px; }
    #poryadok-prototype .task-row {
      display: grid;
      grid-template-columns: 1fr 38px;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      border-bottom: 1px solid color-mix(in srgb, var(--p-line) 55%, transparent);
    }
    #poryadok-prototype .task-check { width: 22px; height: 22px; accent-color: var(--p-fill); }
    #poryadok-prototype .task-row.is-done .task-name { text-decoration: line-through; color: var(--p-muted); }
    #poryadok-prototype .task-menu { border: 0; background: transparent; min-width: 38px; min-height: 38px; color: var(--p-muted); }
    #poryadok-prototype .empty { color: var(--p-muted); padding: 40px 0; text-align: center; }
    #poryadok-prototype .today-progress { margin: 0 0 18px; }
    #poryadok-prototype .today-progress[hidden] { display: none; }
    #poryadok-prototype .progress-text { display: flex; justify-content: space-between; color: var(--p-muted); margin: 8px 0; }
    #poryadok-prototype .meter { height: 9px; background: var(--p-soft); border-radius: 999px; overflow: hidden; }
    #poryadok-prototype .meter > span { display: block; height: 100%; background: var(--p-fill); transition: width .35s ease; }
    #poryadok-prototype .history-row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--p-line); }
    #poryadok-prototype .history-row time { color: var(--p-muted); font-size: 12px; }
    #poryadok-prototype .restore {
      border: 1px solid var(--p-line);
      background: transparent;
      min-height: 38px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }
    #poryadok-prototype .nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 7px 10px 13px;
      border-top: 1px solid var(--p-line);
      background: var(--p-paper);
    }
    #poryadok-prototype .nav-button {
      min-height: 52px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
      color: var(--p-muted);
      font-size: 11px;
    }
    #poryadok-prototype .nav-button i { width: 20px; height: 20px; }
    #poryadok-prototype .nav-button[aria-current="page"] { color: var(--p-ink); font-weight: 500; }
    #poryadok-prototype .modal {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: end center;
      padding: 14px;
      background: light-dark(rgb(25 23 20 / .35), rgb(0 0 0 / .55));
    }
    #poryadok-prototype .modal[hidden] { display: none; }
    #poryadok-prototype .sheet {
      width: 100%;
      background: var(--p-paper);
      border: 1px solid var(--p-line);
      border-radius: 22px;
      padding: 18px;
    }
    #poryadok-prototype .field { display: grid; gap: 5px; margin: 12px 0; }
    #poryadok-prototype .field input,
    #poryadok-prototype .field textarea,
    #poryadok-prototype .field select {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--p-line);
      border-radius: 12px;
      padding: 9px 11px;
      background: var(--p-paper-2);
    }
    #poryadok-prototype .field textarea { height: 58px; min-height: 58px; resize: none; }
    #poryadok-prototype .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    @media (max-width: 360px) {
      #poryadok-prototype { padding-inline: 0; }
      #poryadok-prototype .phone { border-radius: 24px; }
      #poryadok-prototype .screen { padding-inline: 16px; }
      #poryadok-prototype h1 { font-size: 27px; }
    }

    #poryadok-prototype {font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;}
    #poryadok-prototype .task-hit {display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;min-width:0;}
    #poryadok-prototype .task-name {overflow-wrap:anywhere;}
    #poryadok-prototype .task-check {flex-shrink:0;}
    #poryadok-prototype .nav-pearl {width:23px;height:23px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fffef6 0%,#e8e5da 38%,#96958e 90%);box-shadow:inset 0 0 0 1px #ddd9cc;opacity:.55;}
    #poryadok-prototype [aria-current="page"] .nav-pearl {opacity:1;}
    #poryadok-prototype .modal {bottom:auto!important;height:var(--editor-height,100dvh);top:var(--editor-top,0px);place-items:start center;padding:12px;}
    #poryadok-prototype .sheet {max-width:496px;max-height:100%;}
    #loading {min-height:100dvh;display:grid;place-content:center;gap:20px;color:#aaa69e;padding:24px;text-align:center;}
  </style>

  <div id="loading" role="status"><span id="loading-text">Loading…</span><button id="retry-load" hidden>Try again</button></div>
  <section hidden class="phone" aria-label="Pearly">

    <main id="screen-today" class="screen" data-screen="today">

  <script>
    (() => {
      const root = document.getElementById('poryadok-prototype');
      const referenceAssets=JSON.parse(root.querySelector('#pearl-reference-assets').textContent);
      const referenceImages=referenceAssets.map(asset=>{const img=new Image();img.src=asset.src;return img;});
      function decodeImages() { return Promise.all(referenceImages.map(img=>img.decode())); }
      const categories = [
        {id:'bath', name:'Bathroom', note:'Fresh and clean', icon:'bath'},
        {id:'bed', name:'Bedroom', note:'Rest and comfort', icon:'bed-double'},
        {id:'kitchen', name:'Kitchen', note:'Good food', icon:'cooking-pot'},
        {id:'shopping', name:'Shopping', note:'The essentials', icon:'shopping-cart'},
        {id:'home', name:'Utilities', note:'Home essentials', icon:'house'},
        {id:'sale', name:'Selling', note:'A new life for your things', icon:'coins'},
        {id:'hall', name:'Entryway', note:'A welcoming entrance', icon:'coat'},
        {id:'balcony', name:'Balcony', note:'Room to breathe', icon:'panels-top-left'},
        {id:'documents', name:'Documents', note:'Everything at hand', icon:'book-user'},
        {id:'finance', name:'Finances', note:'Peace of mind', icon:'credit-card'}
      ];
      const order=['bed','bath','hall','kitchen','balcony','sale','home','finance','shopping','documents'];
      categories.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
      let tasks = [];
      let editingId = null;
      let busy = false;
      const tg=window.Telegram?.WebApp;
      tg?.ready(); tg?.expand();
      tg?.setHeaderColor('#20201e'); tg?.setBackgroundColor('#20201e');
      async function api(op, fields={}) {
        const response=await fetch('/api', {method:'POST',signal:AbortSignal.timeout(20000),headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''},body:JSON.stringify({op,request_id:crypto.randomUUID(),...fields})});
        const result=await response.json();
        if (!response.ok) throw new Error(result.error||'Could not save');
        tasks=result.tasks.map(t=>({...t,done:!!t.done}));
      }
      async function change(op,fields={}) {
        if(busy) return false;
        busy=true;
        root.querySelectorAll('button,input').forEach(el=>el.disabled=true);
        try {await api(op,fields); return true;}
        catch(error) {alert(error.message||'Connection failed. Please try again.'); return false;}
        finally {busy=false;root.querySelectorAll('button,input').forEach(el=>el.disabled=false);renderTasks();renderHistory();renderToday();}
      }
      function openEditor(id=null) {
        editingId=id;
        const task=tasks.find(t=>t.id===id);
        root.querySelector('#new-title').value=task?.title||'';
        root.querySelector('#new-category').value=task?.category||(filter==='all'?'bed':filter);
        root.querySelector('#editor-heading').textContent=task?'Edit task':'New task';
        root.querySelector('#save-task').textContent=task?'Save':'Add';
        updateCounter();modal.hidden=false;root.querySelector('#new-title').focus();
      }
      function updateCounter() {
        const field=root.querySelector('#new-title');
        const chars=Array.from(field.value);
        if(chars.length>80)field.value=chars.slice(0,80).join('');
        root.querySelector('#title-counter').textContent=Array.from(field.value).length+' / 80';
      }
      let filter = 'all';
      const modal = root.querySelector('#add-modal');
      const clearModal = root.querySelector('#clear-modal');
      function fitEditor() {
        const v=window.visualViewport;
        root.style.setProperty('--editor-height',(v?.height||window.innerHeight)+'px');
        root.style.setProperty('--editor-top',(v?.offsetTop||0)+'px');
      }
      window.visualViewport?.addEventListener('resize',fitEditor);
      window.visualViewport?.addEventListener('scroll',fitEditor);
      fitEditor();

      function go(name) {
        root.querySelectorAll('[data-screen]').forEach(el => el.hidden = el.dataset.screen !== name);
        root.querySelectorAll('.nav-button').forEach(btn => btn.setAttribute('aria-current', btn.dataset.go === name ? 'page' : 'false'));
        if (name === 'tasks') renderTasks();
        if (name === 'history') renderHistory();
        if (name === 'today') renderToday();
      }

      function stateIndex() {
        const active = tasks.filter(t => !t.done).length;
        if (active === 0) return 6;
        const total = Math.max(1, tasks.length);
        return Math.min(5, Math.floor(tasks.filter(t => t.done).length / total * 6));
      }

      function taskWord(number) { return number===1?'task':'tasks'; }

      function renderToday() {
        const active = tasks.filter(t => !t.done).length;
        const done = tasks.filter(t => t.done).length;
        const separator = root.querySelector('#today-separator');
        const taskCount = root.querySelector('#today-task-count');
        const subtitle = root.querySelector('#today-subtitle');
        const progress = root.querySelector('#today-progress');
        const meter = progress.querySelector('.meter');
        const action = root.querySelector('#today-action');
        const canvas = root.querySelector('#tangle');
        const calmVisual = root.querySelector('#calm-visual');
        if (active > 0) {
          canvas.hidden=false;
          calmVisual.hidden=true;
          separator.hidden=false;
          taskCount.hidden=false;
          taskCount.textContent=`${active} ${taskWord(active)}`;
          subtitle.innerHTML='All is well.<br>Start with something small.';
          progress.hidden=false;
          root.querySelector('#today-progress-count').textContent=`${done} of ${tasks.length}`;
          const percent=Math.round(done/Math.max(1,tasks.length)*100);
          meter.setAttribute('aria-valuenow',percent);
          meter.querySelector('span').style.width=`${percent}%`;
          action.textContent='Continue';
          action.dataset.mode='start';
          canvas.setAttribute('aria-label',`Pearl: ${active} threads, one per open task`);
        } else {
          canvas.hidden=false;
          calmVisual.hidden=true;
          separator.hidden=true;
          taskCount.hidden=true;
          subtitle.innerHTML='Everything is in place.<br>More space. You at the center.';
          progress.hidden=true;
          action.textContent='Create task';
          action.dataset.mode='create';
          canvas.setAttribute('aria-label','A pearl within a calm circle. All tasks complete.');
        }
        drawReference(canvas,tasks.filter(t=>!t.done));
      }

      function drawReference(canvas, openTasks) {
        const count=openTasks.length;
        const ctx=canvas.getContext('2d');ctx.clearRect(0,0,600,620);
        canvas.dataset.cordCount=String(count);
        let image,rect;
        if(count===0){image=referenceImages[1];rect=[209,590,444,426];}
        else if(count<=2){image=referenceImages[count+1];rect=[162,440,583,491];}
        else{
          const panel=Math.min(count,10)-3;
          image=referenceImages[0];rect=[(panel%4)*330+20,Math.floor(panel/4)*596+169,291,247];
        }
        if(!image.complete||!image.naturalWidth)return;
        const [x,y,w,h]=rect;
        const scale=Math.min(590/w,570/h),dw=w*scale,dh=h*scale;
        ctx.drawImage(image,x,y,w,h,(600-dw)/2,(620-dh)/2,dw,dh);
        // The approved fixed illustrations cover 0–10 tasks. Extra tasks add threads.
        for(let i=10;i<count;i++){
          const a=i*2.399;
          ctx.save();ctx.translate(300,310);ctx.rotate(a);
          ctx.strokeStyle=i%2?'#d1cabc':'#444139';ctx.lineWidth=1.6;
          ctx.beginPath();ctx.moveTo(-205,-135);ctx.bezierCurveTo(-210,30,190,-160,150,30);ctx.bezierCurveTo(130,190,-180,30,195,160);ctx.stroke();
          ctx.fillStyle=ctx.strokeStyle;
          for(const p of [[-205,-135],[195,160]]){ctx.beginPath();ctx.arc(p[0],p[1],3,0,Math.PI*2);ctx.fill();}ctx.restore();
        }
      }

      function drawPencil(canvas, openTasks) {
        const ctx=canvas.getContext('2d');
        const swatch=document.createElement('span');root.appendChild(swatch);
        const color=value=>{swatch.style.color=value;return getComputedStyle(swatch).color;};
        const pale=color('light-dark(#817c72, #d1cdc2)');
        const graphite=color('light-dark(#302f2d, #8c8982)');
        const pearlWhite=color('light-dark(#faf9f4, #f0eee5)');
        const pearlGray=color('light-dark(#a09e97, #8e8c85)');
        swatch.remove();
        ctx.clearRect(0,0,600,620);
        canvas.dataset.cordCount=String(openTasks.length);
        const cx=300,cy=292;
        let randomSeed=7341;
        const random=()=>{randomSeed=(randomSeed*1664525+1013904223)>>>0;return randomSeed/4294967296;};
        // One continuous pencil mark per task, with fine grain along its width.
        const pencil=(path,tone,width=2)=>{
          ctx.save();ctx.strokeStyle=tone;ctx.lineCap='round';
          for(let pass=0;pass<3;pass++){
            ctx.globalAlpha=pass===0?.65:.20;ctx.lineWidth=pass===0?width:.65;
            ctx.beginPath();path.forEach(([x,y],i)=>{
              const jitter=pass===0?0:Math.sin(i*1.7+pass)*.65;
              i?ctx.lineTo(x+jitter,y+jitter):ctx.moveTo(x+jitter,y+jitter);
            });ctx.stroke();
          }ctx.restore();
        };
        // Matte pearl, with curved graphite strokes instead of a glossy halo.
        ctx.save();ctx.beginPath();ctx.ellipse(cx,cy,66,70,-.08,0,Math.PI*2);ctx.clip();
        const fill=ctx.createRadialGradient(cx-22,cy-24,3,cx+12,cy+14,91);
        fill.addColorStop(0,pearlWhite);fill.addColorStop(.45,pearlWhite);fill.addColorStop(1,pearlGray);
        ctx.fillStyle=fill;ctx.fillRect(cx-70,cy-75,140,150);
        ctx.strokeStyle=graphite;
        for(let i=0;i<170;i++){
          const r=8+random()*90, a=random()*6.28;
          ctx.globalAlpha=.035+random()*.09;ctx.lineWidth=.4+random()*.65;
          ctx.beginPath();ctx.ellipse(cx-14,cy-15,r,r*1.08,-.08,a,a+.4+random()*.9);ctx.stroke();
        }
        for(let i=0;i<1600;i++){
          ctx.globalAlpha=.025+random()*.055;ctx.fillStyle=graphite;
          ctx.fillRect(cx-70+random()*140,cy-75+random()*150,.6,.6);
        }ctx.restore();
        const bezier=(start,segments)=>{
          let p=start;const points=[p];
          for(const [a,b,end] of segments){
            for(let j=1;j<=60;j++){
              const t=j/60,u=1-t;
              points.push([u*u*u*p[0]+3*u*u*t*a[0]+3*u*t*t*b[0]+t*t*t*end[0],u*u*u*p[1]+3*u*u*t*a[1]+3*u*t*t*b[1]+t*t*t*end[1]]);
            }p=end;
          }return points;
        };
        if(!openTasks.length){
          for(let k=0;k<3;k++){
            const path=[];
            for(let j=0;j<=230;j++){
              const a=j/230*Math.PI*2+.3*k,r=155+5*k+Math.sin(a*3+k)*3;
              path.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r*1.025]);
            }pencil(path,k===1?graphite:pale,1.3);
          }return;
        }
        openTasks.forEach((task,index)=>{
          let path;
          if(openTasks.length===1){
            path=bezier([374,108],[ [[420,208],[284,198],[227,251]], [[171,317],[306,335],[341,351]], [[390,387],[143,341],[133,427]] ]);
          }else if(openTasks.length===2){
            path=index===0
              ?bezier([187,108],[ [[162,197],[298,140],[376,236]], [[463,369],[291,356],[310,375]], [[336,420],[436,390],[450,451]] ])
              :bezier([509,112],[ [[493,208],[328,183],[303,185]], [[151,169],[176,376],[282,373]], [[491,354],[424,166],[365,186]], [[280,246],[112,330],[110,425]] ]);
          }else{
            const a=index*2.399963,r=119+(index%4)*13,ry=96+(index%3)*13;
            path=[];
            for(let j=0;j<=200;j++){
              const t=j/200,theta=-.7+t*6.5,tail=Math.pow(Math.abs(t-.5)*2,8)*87;
              const x=(r+tail)*Math.cos(theta),y=(ry+tail)*Math.sin(theta);
              path.push([cx+x*Math.cos(a)-y*Math.sin(a),cy+x*Math.sin(a)+y*Math.cos(a)]);
            }
          }
          const tone=index%2?graphite:pale;pencil(path,tone,2.2);
          for(const [x,y] of [path[0],path[path.length-1]]){
            ctx.fillStyle=tone;ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fill();
            ctx.fillStyle=pearlWhite;ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(x-1,y-1,1.2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
          }
        });
      }

      function drawCords(canvas, openTasks) {
        const ctx=canvas.getContext('2d');
        const swatch=document.createElement('span');
        root.appendChild(swatch);
        const color=value=>{swatch.style.color=value;return getComputedStyle(swatch).color;};
        const pale=color('light-dark(#a69984, #e1d6c1)');
        const dark=color('light-dark(#37342f, #777167)');
        const hi=color('var(--p-pearl-hi)');
        const mid=color('var(--p-pearl-mid)');
        const shade=color('var(--p-pearl-shade)');
        swatch.remove();
        ctx.clearRect(0,0,600,620);
        canvas.dataset.cordCount=String(openTasks.length);
        const cx=300,cy=285;
        const glow=ctx.createRadialGradient(cx,cy,35,cx,cy,170);
        glow.addColorStop(0,'rgba(220,207,179,.13)');glow.addColorStop(1,'rgba(220,207,179,0)');
        ctx.fillStyle=glow;ctx.fillRect(0,0,600,620);
        openTasks.forEach(task=>{
          const seed=task.id%997;
          const angle=seed*2.3999632297;
          const rx=135+(seed%5)*10,ry=98+(seed%4)*12;
          const points=[];
          for(let j=0;j<=180;j++){
            const t=j/180;
            const theta=-.65+t*Math.PI*2.05;
            const tail=Math.pow(Math.abs(t-.5)*2,9)*96;
            const x=(rx+tail)*Math.cos(theta), y=(ry+tail)*Math.sin(theta);
            points.push([cx+x*Math.cos(angle)-y*Math.sin(angle),cy+x*Math.sin(angle)+y*Math.cos(angle)]);
          }
          ctx.beginPath();points.forEach(([x,y],j)=>j?ctx.lineTo(x,y):ctx.moveTo(x,y));
          ctx.strokeStyle=seed%2?pale:dark;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.stroke();
          for(const [x,y] of [points[0],points[points.length-1]]){
            const bead=ctx.createRadialGradient(x-1,y-2,.5,x,y,6);
            bead.addColorStop(0,seed%2?hi:pale);bead.addColorStop(1,seed%2?pale:dark);
            ctx.fillStyle=bead;ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();
          }
        });
        ctx.save();
        ctx.beginPath();ctx.ellipse(cx,cy,65,69,-.12,0,Math.PI*2);ctx.clip();
        const pearl=ctx.createRadialGradient(cx-22,cy-25,2,cx+6,cy+10,86);
        pearl.addColorStop(0,hi);pearl.addColorStop(.40,mid);pearl.addColorStop(.80,shade);pearl.addColorStop(1,dark);
        ctx.fillStyle=pearl;ctx.fillRect(cx-70,cy-75,140,150);
        for(let i=0;i<65;i++){
          ctx.beginPath();
          for(let j=0;j<=100;j++){
            const a=j/100*Math.PI*2,r=i*1.45+Math.sin(a*7+i*.7)*.8;
            const x=cx-12+Math.cos(a)*r,y=cy-13+Math.sin(a)*r*1.08;
            j?ctx.lineTo(x,y):ctx.moveTo(x,y);
          }
          ctx.strokeStyle=i%2?hi:shade;ctx.globalAlpha=.18;ctx.lineWidth=.8;ctx.stroke();
        }
        ctx.restore();
      }

      function drawTangle(canvas, state, large=false) {
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const styles=getComputedStyle(root);
        const ink = styles.getPropertyValue('--p-ink').trim();
        const muted = styles.getPropertyValue('--p-line').trim();
        const pearlHi = styles.getPropertyValue('--p-pearl-hi').trim();
        const pearlMid = styles.getPropertyValue('--p-pearl-mid').trim();
        const pearlShade = styles.getPropertyValue('--p-pearl-shade').trim();
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0,0,w,h);
        ctx.strokeStyle = ink;
        ctx.lineCap = 'round';
        const cx = w/2, cy = h*(large?.43:.48);
        if (state >= 6) {
          const radius = large ? 142 : 108;
          ctx.strokeStyle=ink;
          ctx.lineWidth=large ? 4.2 : 4.8;
          for (let i=0;i<9;i++) {
            ctx.globalAlpha=.38+i*.055;
            ctx.beginPath();
            for (let s=0;s<=120;s++) {
              const t=s/120*Math.PI*2;
              const wobble=Math.sin(t*(2+i%3)+i)*4;
              const x=cx+Math.cos(t)*(radius+wobble+i*.8);
              const y=cy+Math.sin(t)*(radius+wobble-i*.5);
              s?ctx.lineTo(x,y):ctx.moveTo(x,y);
            }
            ctx.stroke();
          }
          const pearlRadius=large ? 50 : 42;
          const pearl=ctx.createRadialGradient(cx-14,cy-16,4,cx,cy,pearlRadius+5);
          pearl.addColorStop(0,pearlHi);
          pearl.addColorStop(.5,pearlMid);
          pearl.addColorStop(1,pearlShade);
          ctx.globalAlpha=1;
          ctx.fillStyle=pearl;
          ctx.beginPath(); ctx.arc(cx,cy,pearlRadius,0,Math.PI*2); ctx.fill();
          ctx.strokeStyle=pearlHi;
          ctx.globalAlpha=.85;
          ctx.lineWidth=2;
          ctx.stroke();
          ctx.globalAlpha=1;
          return;
        }
        const density = Math.max(5, 31-state*5);
        const radius = large ? 165-state*19 : 135-state*17;
        ctx.lineWidth = large ? 4.3 : 4.8;
        for (let i=0;i<density;i++) {
          const a = i*2.399 + state*.33;
          const rx = Math.max(34, radius*(.58 + ((i*17)%10)/24));
          const ry = Math.max(34, radius*(.48 + ((i*13)%11)/25));
          ctx.beginPath();
          for (let s=0;s<=90;s++) {
            const t=s/90*Math.PI*2;
            const wobble=Math.sin(t*(3+(i%4))+a)*11*(1-state/7);
            const x=cx+Math.cos(t+a)*rx+wobble;
            const y=cy+Math.sin(t+a*.7)*ry+Math.cos(t*4+i)*7;
            s?ctx.lineTo(x,y):ctx.moveTo(x,y);
          }
          ctx.globalAlpha=.35+(i%density)/density*.45;
          ctx.stroke();
        }
        ctx.globalAlpha=1;
        if (state>=5) {
          ctx.strokeStyle=ink; ctx.lineWidth=7; ctx.beginPath(); ctx.arc(cx,cy,62,0,Math.PI*2); ctx.stroke();
        }
        if (large) {
          ctx.strokeStyle=muted; ctx.lineWidth=3; ctx.beginPath();
          ctx.moveTo(cx-110,cy+radius+40); ctx.bezierCurveTo(cx-30,cy+radius+18,cx+30,cy+radius+62,cx+120,cy+radius+32); ctx.stroke();
        }
      }

      function escapeText(text) {
        return String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }
      function categoryIcon(c) {
        return c.icon==='coat' ? '<span class="coat-icon" aria-hidden="true">🧥</span>' : `<i data-lucide="${c.icon}" aria-hidden="true"></i>`;
      }
      function renderCategories() {
        root.querySelector('#category-list').innerHTML = categories.map(c => `<button class="category cursor-interaction" type="button" data-category="${c.id}">${categoryIcon(c)}<span><strong>${c.name}</strong><small>${c.note}</small></span><i data-lucide="chevron-right" aria-hidden="true"></i></button>`).join('');
        root.querySelector('#new-category').innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        root.querySelectorAll('[data-category]').forEach(btn => btn.addEventListener('click', () => { filter=btn.dataset.category; go('tasks'); }));
      }

      function renderFilters() {
        const all = [{id:'all',name:'All'}, ...categories];
        root.querySelector('#filters').innerHTML = all.map(c => `<button class="filter cursor-interaction" type="button" data-filter="${c.id}" aria-pressed="${filter===c.id}">${c.name}</button>`).join('');
        root.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => { filter=btn.dataset.filter; renderTasks(); }));
      }

      function renderTasks() {
        renderFilters();
        const shownCats = filter==='all' ? categories : categories.filter(c => c.id===filter);
        const html = shownCats.map(c => {
          const rows = tasks.filter(t => t.category===c.id && !t.done);
          if (!rows.length) return '';
          return `<section class="task-group"><div class="group-title">${categoryIcon(c)}<h3>${c.name}</h3></div>${rows.map(t => `<div class="task-row"><label class="task-hit"><input class="task-check" type="checkbox" aria-label="Complete: ${escapeText(t.title)}" data-task="${t.id}"><span class="task-name">${escapeText(t.title)}</span></label><button class="task-menu cursor-interaction" type="button" data-edit="${t.id}" aria-label="Edit task ${escapeText(t.title)}"><i data-lucide="pencil" aria-hidden="true"></i></button></div>`).join('')}</section>`;
        }).join('');
        root.querySelector('#task-list').innerHTML = html || '<div class="empty">All done in this category.<br>Take a breath.</div>';
        root.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click',()=>openEditor(Number(btn.dataset.edit))));
        root.querySelectorAll('[data-task]').forEach(box => box.addEventListener('change', () => completeTask(Number(box.dataset.task))));
        if (window.lucide) lucide.createIcons({attrs:{width:16,height:16}});
      }

      async function completeTask(id) { await change('complete',{id}); go('tasks'); }

      function renderHistory() {
        const done=tasks.filter(t=>t.done);
        root.querySelector('#history-list').innerHTML = done.length ? done.slice().reverse().map(t => {
          const c=categories.find(c=>c.id===t.category);
          return `<div class="history-row"><i data-lucide="check-circle-2" aria-hidden="true"></i><div><strong>${escapeText(t.title)}</strong><br><time>${c.name}</time></div><button class="restore cursor-interaction" type="button" data-restore="${t.id}">Restore</button></div>`;
        }).join('') : '<div class="empty">Your history begins with your first completed task.</div>';
        root.querySelector('#clear-history').hidden=!done.length;
        root.querySelectorAll('[data-restore]').forEach(btn => btn.addEventListener('click',()=>restoreTask(Number(btn.dataset.restore))));
        if (window.lucide) lucide.createIcons({attrs:{width:16,height:16}});
      }

      async function restoreTask(id) { await change('restore',{id}); }

      root.querySelectorAll('[data-go]').forEach(btn => btn.addEventListener('click',()=>go(btn.dataset.go)));
      root.querySelector('#today-action').addEventListener('click',()=>{
        if (root.querySelector('#today-action').dataset.mode==='create') {
          openEditor();
        } else {
          go('tasks');
        }
      });
      root.querySelectorAll('[data-open-add]').forEach(btn => btn.addEventListener('click',()=>{ openEditor(); }));
      root.querySelectorAll('[data-close-add]').forEach(btn => btn.addEventListener('click',()=>{ modal.hidden=true; }));
      root.querySelector('#clear-history').addEventListener('click',()=>{ clearModal.hidden=false; });
      root.querySelector('[data-cancel-clear]').addEventListener('click',()=>{ clearModal.hidden=true; });
      root.querySelector('[data-confirm-clear]').addEventListener('click',async()=>{if(await change('clear'))clearModal.hidden=true;});
      root.querySelector('#new-title').addEventListener('input',updateCounter);
      root.querySelector('#add-form').addEventListener('submit',async e=>{
        e.preventDefault();
        const title=root.querySelector('#new-title').value.trim();
        if(!title || Array.from(title).length>80)return;
        const category=root.querySelector('#new-category').value;
        const ok=await change(editingId===null?'create':'edit',{id:editingId,title,category});
        if(ok){modal.hidden=true;editingId=null;filter='all';go('tasks');}
      });
      renderCategories(); renderTasks(); renderHistory();
      async function boot() {
        root.querySelector('#retry-load').hidden=true;
        root.querySelector('#loading-text').textContent='Loading…';
        try {
          await Promise.all([api('state'),decodeImages()]);
          renderTasks();renderHistory();renderToday();
          root.querySelector('.phone').hidden=false;
          root.querySelector('#loading').hidden=true;
          tg?.ready();
        } catch(error) {
          root.querySelector('#loading-text').textContent=error.message||'Could not load. Please try again.';
          root.querySelector('#retry-load').hidden=false;
        }
      }
      root.querySelector('#retry-load').addEventListener('click',boot);
      boot();
      if (window.lucide) lucide.createIcons({attrs:{width:16,height:16}});
    })();
  </script>
</div>
</body></html>
